; PHP limits for this site (read by PHP-FPM / CGI hosts, e.g. cPanel).
; Lesson and assignment files may be up to 50 MB each (config/elearning.php),
; and one save can carry several files. PHP's defaults (2M / 8M) silently drop them.
upload_max_filesize = 64M
post_max_size = 256M
max_file_uploads = 20
max_execution_time = 300
max_input_time = 300
