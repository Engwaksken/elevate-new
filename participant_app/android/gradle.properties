# Sized for an 8 GB development PC: the previous 8G heap + 4G metaspace crashed the JVM
# ("insufficient memory", hs_err_pid*.log). Raise only on machines with more RAM.
org.gradle.jvmargs=-Xmx3G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError
org.gradle.workers.max=2
kotlin.daemon.jvmargs=-Xmx1G
android.useAndroidX=true
# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# The project is on D: while the Pub cache is on C:. Kotlin incremental
# compilation can fail when cache paths span different Windows drive roots.
# Disable incremental compilation for deterministic Android release builds.
kotlin.incremental=false
kotlin.incremental.useClasspathSnapshot=false
