name: elevateher360_participant
description: Offline-first participant mobile app for ElevateHer360.
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  dio: ^5.8.0+1
  connectivity_plus: ^6.1.4
  flutter_secure_storage: ^9.2.4
  sqflite: ^2.4.2
  path: ^1.9.1
  path_provider: ^2.1.5
  shared_preferences: ^2.5.3
  uuid: ^4.5.1
  url_launcher: ^6.3.1
  share_plus: ^10.1.4
  printing: ^5.14.2
  file_picker: ^10.3.3
  open_filex: ^4.7.0
  android_intent_plus: ^5.3.0
  flutter_local_notifications: ^19.1.0
  timezone: ^0.10.0
  firebase_core: ^3.13.0
  firebase_messaging: ^15.2.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.4

flutter:
  uses-material-design: true
  assets:
    - assets/logo.png
    - assets/fonts/Rubik-OFL.txt

  # Rubik (SIL Open Font License 1.1), bundled so no fonts are fetched at
  # runtime. The licence text is registered in main.dart.
  fonts:
    - family: Rubik
      fonts:
        - asset: assets/fonts/Rubik-Regular.ttf
        - asset: assets/fonts/Rubik-Medium.ttf
          weight: 500
        - asset: assets/fonts/Rubik-Bold.ttf
          weight: 700

# Regenerate app icons with: dart run flutter_launcher_icons
flutter_launcher_icons:
  image_path: "assets/icon/app_icon.png"
  android: "ic_launcher"
  min_sdk_android: 21
  adaptive_icon_background: "#5E2800"
  adaptive_icon_foreground: "assets/icon/app_icon.png"
  adaptive_icon_foreground_inset: 16
  ios: true
  remove_alpha_ios: true
  background_color_ios: "#5E2800"
